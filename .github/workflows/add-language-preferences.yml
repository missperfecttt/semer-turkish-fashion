name: Add Semer Language Preferences

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  language-preferences:
    if: ${{ !contains(github.event.head_commit.message, 'Add Amharic and Afaan Oromo language preferences') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add language selector and translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="semer-language"' in s:
              raise SystemExit(0)

          selector = '''<select id="semer-language" aria-label="Language" style="appearance:none;background:#FDFBF7;border:1px solid #BCAAA4;border-radius:999px;padding:7px 24px 7px 10px;font-size:10px;font-weight:600;color:#3E2723;cursor:pointer;max-width:82px"><option value="en">EN</option><option value="am">አማ</option><option value="om">OM</option></select>'''
          marker = '<div class="flex items-center justify-end gap-4 sm:gap-6">'
          if marker in s:
              s = s.replace(marker, marker + selector, 1)
          else:
              marker2 = '<div class="flex justify-end items-center gap-4 sm:gap-6">'
              s = s.replace(marker2, marker2 + selector, 1)

          mobile = '''
          <div id="semer-mobile-language" style="padding:16px 0;border-bottom:1px solid #EFEBE1">
            <label for="semer-mobile-lang" style="display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px">Language / ቋንቋ / Afaan</label>
            <select id="semer-mobile-lang" aria-label="Language" style="width:100%;appearance:none;background:#FDFBF7;border:1px solid #BCAAA4;border-radius:8px;padding:12px;font-size:13px;color:#3E2723"><option value="en">English</option><option value="am">አማርኛ</option><option value="om">Afaan Oromoo</option></select>
          </div>'''
          mobile_marker = '<a href="#lookbook" class="block py-4 border-b border-beige font-serif text-xl">Lookbook</a>'
          if mobile_marker in s:
              s = s.replace(mobile_marker, mobile_marker + mobile, 1)

          script = r'''<script id="semer-language-script">
          const semerTranslations={
            en:{delivery:'Free delivery within Addis Ababa for orders over 3,000 ETB',home:'Home',shop:'Shop',lookbook:'Lookbook',visit:'Visit Us',collection:'Turkish Modest Collection',heroTitle:'Timeless<br><span class="italic text-gold">Modest</span> Elegance',heroText:'Graceful Turkish fashion created for women who love elegance, coverage and timeless Muslim style.',shopCollection:'Shop Collection',viewLookbook:'View Lookbook',fast:'Fast Delivery',fabric:'Turkish Fabric',payments:'Local Payments',modest:'Modest Style',shopStyle:'Shop by style',essentials:'Muslim Modest Essentials',sets:'Modest Sets',hijabs:'Hijabs & Shawls',dresses:'Maxi Dresses',abayas:'Abayas & Outerwear',curated:'Curated for modesty',newArrivals:'New Arrivals',new:'New',best:'Best Seller',style:'Style Inspiration',footerText:'Timeless Turkish modest fashion for the modern Muslim woman in Ethiopia.',contact:'Contact',telegramOrder:'Order via Telegram'},
            am:{delivery:'ከ3,000 ብር በላይ ለሚያዙ ደንበኞች በአዲስ አበባ ነፃ መላኪያ',home:'መነሻ',shop:'ሱቅ',lookbook:'የፋሽን ምስሎች',visit:'ይጎብኙን',collection:'የቱርክ ልከኛ ፋሽን',heroTitle:'ዘላቂ<br><span class="italic text-gold">ልከኛ</span> ውበት',heroText:'ውበትን፣ ልከኝነትን እና የሙስሊም ፋሽንን ለሚወዱ ሴቶች የተዘጋጀ የቱርክ ፋሽን።',shopCollection:'ስብስቡን ይመልከቱ',viewLookbook:'የፋሽን ምስሎችን ይመልከቱ',fast:'ፈጣን መላኪያ',fabric:'የቱርክ ጨርቅ',payments:'የአካባቢ ክፍያ',modest:'ልከኛ ስታይል',shopStyle:'በስታይል ይምረጡ',essentials:'የሙስሊም ልከኛ ፋሽን',sets:'ልከኛ ስብስቦች',hijabs:'ሂጃብ እና ሻውል',dresses:'ማክሲ ቀሚሶች',abayas:'አባያ እና የውጭ ልብሶች',curated:'ለልከኝነት የተመረጠ',newArrivals:'አዲስ ምርቶች',new:'አዲስ',best:'በጣም የሚሸጥ',style:'የስታይል አነሳሽነት',footerText:'ለዘመናዊቷ ሙስሊም ሴት የተዘጋጀ ዘላቂ የቱርክ ልከኛ ፋሽን።',contact:'ያግኙን',telegramOrder:'በTelegram ይዘዙ'},
            om:{delivery:'Ajaja bilisaa Finfinnee keessatti ajaja 3,000 ETB ol ta’eef',home:'Mana',shop:'Dukkaana',lookbook:'Lookbook',visit:'Nu Daawwadhaa',collection:'Koleekshinii Uffata Turkii Sirrii',heroTitle:'Bareedina<br><span class="italic text-gold">Sirrii</span> Yeroo Hin Darbine',heroText:'Uffata Turkii bareedaa, qaama haguuguu fi akkaataa Islaamaa ammayyaa jaallataniif qophaa’e.',shopCollection:'Koleekshinii Ilaali',viewLookbook:'Lookbook Ilaali',fast:'Geejjiba Saffisaa',fabric:'Huccuu Turkii',payments:'Kaffaltii Naannoo',modest:'Akkaataa Sirrii',shopStyle:'Akkaataan Filadhu',essentials:'Uffata Islaamaa Sirrii',sets:'Setoota Sirrii',hijabs:'Hijabii fi Shaawulii',dresses:'Uffata Maxi',abayas:'Abayaa fi Uffata Alaa',curated:'Sirrummaaf Filatame',newArrivals:'Uffata Haaraa',new:'Haaraa',best:'Kan Baay’ee Gurguramu',style:'Yaada Akkaataa',footerText:'Uffata Turkii sirrii, dubartii Muslimaa ammayyaaf qophaa’e.',contact:'Nu Qunnamaa',telegramOrder:'Telegram irratti ajaji'}
          };
          (function(){
            const desktop=document.getElementById('semer-language'), mobile=document.getElementById('semer-mobile-lang');
            let lang=localStorage.getItem('semerLanguage')||'en';
            function apply(){
              const tr=semerTranslations[lang]||semerTranslations.en;
              document.documentElement.lang=lang;
              document.querySelectorAll('[data-i18n]').forEach(el=>{if(tr[el.dataset.i18n])el.innerHTML=tr[el.dataset.i18n]});
              if(desktop)desktop.value=lang;if(mobile)mobile.value=lang;
              localStorage.setItem('semerLanguage',lang);
            }
            function change(v){lang=v;apply()}
            if(desktop)desktop.addEventListener('change',e=>change(e.target.value));
            if(mobile)mobile.addEventListener('change',e=>change(e.target.value));
            apply();
          })();
          </script>'''

          # Add translation markers to common existing text.
          replacements={
            '>Free delivery within Addis Ababa for orders over 3,000 ETB<': ' data-i18n="delivery">Free delivery within Addis Ababa for orders over 3,000 ETB<',
            '>Home</a>':' data-i18n="home">Home</a>',
            '>Lookbook</a>':' data-i18n="lookbook">Lookbook</a>',
            '>Visit Us</a>':' data-i18n="visit">Visit Us</a>',
            '>Turkish Modest Collection</p>':' data-i18n="collection">Turkish Modest Collection</p>',
            '>Shop Collection</a>':' data-i18n="shopCollection">Shop Collection</a>',
            '>View Lookbook</a>':' data-i18n="viewLookbook">View Lookbook</a>',
            '>Fast Delivery</h4>':' data-i18n="fast">Fast Delivery</h4>',
            '>Turkish Fabric</h4>':' data-i18n="fabric">Turkish Fabric</h4>',
            '>Local Payments</h4>':' data-i18n="payments">Local Payments</h4>',
            '>Modest Style</h4>':' data-i18n="modest">Modest Style</h4>',
            '>Shop by style</p>':' data-i18n="shopStyle">Shop by style</p>',
            '>Muslim Modest Essentials</h2>':' data-i18n="essentials">Muslim Modest Essentials</h2>',
            '>Modest Sets</h3>':' data-i18n="sets">Modest Sets</h3>',
            '>Hijabs & Shawls</h3>':' data-i18n="hijabs">Hijabs & Shawls</h3>',
            '>Maxi Dresses</h3>':' data-i18n="dresses">Maxi Dresses</h3>',
            '>Abayas & Outerwear</h3>':' data-i18n="abayas">Abayas & Outerwear</h3>',
            '>Curated for modesty</p>':' data-i18n="curated">Curated for modesty</p>',
            '>New Arrivals</h2>':' data-i18n="newArrivals">New Arrivals</h2>',
            '>New</span>':' data-i18n="new">New</span>',
            '>Best Seller</span>':' data-i18n="best">Best Seller</span>',
            '>Style Inspiration</h2>':' data-i18n="style">Style Inspiration</h2>',
            '>Contact</h4>':' data-i18n="contact">Contact</h4>',
            '>Order via Telegram</span>':' data-i18n="telegramOrder">Order via Telegram</span>'
          }
          for a,b in replacements.items():
              if a in s: s=s.replace(a,b,1)

          if '</body>' in s:
              s=s.replace('</body>',script+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Amharic and Afaan Oromo language preferences"
          git push
